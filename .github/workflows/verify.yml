name: FishDev verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Action pins are generated from .config/ai/release.json by .config/ai/tools/release.py update.
      # BEGIN fishdev-release:uses:actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # END fishdev-release:uses:actions/checkout
      # BEGIN fishdev-release:uses:actions/setup-python
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      # END fishdev-release:uses:actions/setup-python
        with:
          python-version: '3.11'
      - run: python .config/ai/tools/fishdev.py verify --ci
